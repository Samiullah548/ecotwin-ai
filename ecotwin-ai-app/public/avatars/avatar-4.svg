<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141525" />
      <stop offset="100%" stop-color="#0c0710" />
    </linearGradient>
    <linearGradient id="globeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#311b92" />
      <stop offset="50%" stop-color="#673ab7" />
      <stop offset="100%" stop-color="#b388ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="url(#grad4)" stroke="#b388ff" stroke-width="2" />
  <!-- Globe -->
  <circle cx="50" cy="50" r="28" fill="url(#globeGrad)" filter="url(#glow)" opacity="0.8" />
  <!-- Grid Lines -->
  <ellipse cx="50" cy="50" rx="28" ry="10" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3" />
  <ellipse cx="50" cy="50" rx="10" ry="28" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3" />
  <line x1="22" y1="50" x2="78" y2="50" stroke="#ffffff" stroke-width="1" opacity="0.3" />
  <line x1="50" y1="22" x2="50" y2="78" stroke="#ffffff" stroke-width="1" opacity="0.3" />
  <!-- Leaf silhouette Overlay -->
  <path d="M50,32 C38,42 38,58 50,68 C62,58 62,42 50,32 Z" fill="#d3fe32" opacity="0.8" />
</svg>
