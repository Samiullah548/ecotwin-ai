<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b250b" />
      <stop offset="100%" stop-color="#141a0e" />
    </linearGradient>
    <linearGradient id="treeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef6c00" />
      <stop offset="50%" stop-color="#ffb74d" />
      <stop offset="100%" stop-color="#d3fe32" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="url(#grad3)" stroke="#ffb74d" stroke-width="2" />
  <!-- Tree Trunk -->
  <rect x="48" y="62" width="4" height="15" fill="#ef6c00" rx="2" />
  <!-- Tree Canopy Layers -->
  <polygon points="50,22 28,52 72,52" fill="url(#treeGrad)" filter="url(#glow)" />
  <polygon points="50,32 32,58 68,58" fill="url(#treeGrad)" opacity="0.9" />
  <polygon points="50,42 36,65 64,65" fill="url(#treeGrad)" opacity="0.8" />
  <!-- Nodes -->
  <circle cx="50" cy="22" r="3" fill="#ffffff" />
  <circle cx="28" cy="52" r="2.5" fill="#ffffff" />
  <circle cx="72" cy="52" r="2.5" fill="#ffffff" />
</svg>
